[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kotg"
version = "0.1.0"
description = "KOTG.AI — Local-first, multi-agent Kubernetes intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["kubernetes", "ai", "llm", "multi-agent", "devops", "sre"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    # LLM providers / inference
    "litellm>=1.30.0",
    "ollama>=0.3.0",
    # Agent orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # RAG / embeddings
    "llama-index-core>=0.11.0",
    "llama-index-vector-stores-qdrant>=0.3.0",
    "llama-index-embeddings-ollama>=0.3.0",
    "qdrant-client>=1.11.0",
    # MCP
    "mcp>=1.0.0",
    # Data models & validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.8.0",
    # API server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Templates
    "jinja2>=3.1.0",
    # Async utils
    "anyio>=4.6.0",
    "httpx>=0.27.0",
    # Kubernetes client
    "kubernetes>=31.0.0",
    # Observability
    "structlog>=24.4.0",
    # YAML / config
    "pyyaml>=6.0.2",
    "tomli>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "black>=24.10.0",
    "pre-commit>=4.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
kotg = "kotg.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["kotg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "C4", "PT"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=kotg --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py312"]
