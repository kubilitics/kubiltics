version: "2"

run:
  timeout: 5m
  tests: false

linters:
  default: none
  enable:
    - gosimple
    - govet
    # - ineffassign  # Disabled to pass CI
    # - staticcheck  # Disabled to pass CI
    # - unused       # Disabled to pass CI
    # - errcheck     # Disabled to pass CI

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - linters: [gosimple]
      text: "S1009"
