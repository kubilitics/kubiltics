server:
  port: 28081
backend:
  address: localhost:50061
  http_base_url: http://localhost:8190
  timeout: 120
llm:
  provider: openai
  openai:
    # Point the OpenAI-shaped client at Together.ai. Any endpoint speaking
    # /v1/chat/completions works via the same base_url override.
    base_url: https://api.together.xyz/v1
    # api_key_env names the env var holding the secret so the YAML stays
    # safe to commit. The server resolves it at startup (and on SIGHUP).
    api_key_env: TOGETHER_API_KEY
    model: meta-llama/Llama-3.3-70B-Instruct-Turbo
  tool_router:
    enabled: true
budget:
  global_monthly_budget: 5
database:
  type: sqlite
  sqlite_path: /tmp/ai-bench-together.db
logging:
  level: info
  format: json
