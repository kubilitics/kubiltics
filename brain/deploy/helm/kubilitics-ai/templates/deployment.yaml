{{- $secretParts := splitList "|" (include "kubilitics-ai.llmSecret" .) -}}
{{- $secretName := index $secretParts 0 -}}
{{- $secretKey := index $secretParts 1 -}}
{{- $envVarName := include "kubilitics-ai.llmEnvVarName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubilitics-ai.fullname" . }}
  labels:
    {{- include "kubilitics-ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubilitics-ai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubilitics-ai.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kubilitics-ai.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kubilitics-ai
          image: {{ include "kubilitics-ai.imageRef" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - "--config"
            - "/etc/kubilitics/config.yaml"
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
          env:
            # ── LLM API key (provider-specific env var) ─────────────
            {{- if and $secretName $envVarName }}
            - name: {{ $envVarName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $secretKey }}
            {{- end }}
            # ── Engine adapter env vars (3c + 3d skeletons) ─────────
            {{- if .Values.engines.kagent.enabled }}
            - name: KAGENT_ENDPOINT
              value: {{ .Values.engines.kagent.endpoint | quote }}
            {{- if .Values.engines.kagent.defaultAgentId }}
            - name: KAGENT_DEFAULT_AGENT_ID
              value: {{ .Values.engines.kagent.defaultAgentId | quote }}
            {{- end }}
            {{- if .Values.engines.kagent.namespace }}
            - name: KAGENT_NAMESPACE
              value: {{ .Values.engines.kagent.namespace | quote }}
            {{- end }}
            {{- if .Values.engines.kagent.userId }}
            - name: KAGENT_USER_ID
              value: {{ .Values.engines.kagent.userId | quote }}
            {{- end }}
            {{- if .Values.engines.kagent.requestTimeoutSeconds }}
            - name: KAGENT_REQUEST_TIMEOUT_SECONDS
              value: {{ .Values.engines.kagent.requestTimeoutSeconds | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.engines.python.enabled }}
            - name: PYTHON_AGENT_ENDPOINT
              value: {{ .Values.engines.python.endpoint | quote }}
            {{- if .Values.engines.python.defaultWorkflow }}
            - name: PYTHON_AGENT_WORKFLOW
              value: {{ .Values.engines.python.defaultWorkflow | quote }}
            {{- end }}
            {{- end }}
            # ── Safety wrapper allow-list (3e) ──────────────────────
            {{- if .Values.safety.allowedActions }}
            - name: KUBILITICS_AI_ALLOWED_ACTIONS
              value: {{ join "," .Values.safety.allowedActions | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/kubilitics
              readOnly: true
            - name: data
              mountPath: /var/lib/kubilitics
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kubilitics-ai.fullname" . }}-config
        - name: data
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
