# Release automation: build and publish artifacts on version tag
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  checks: read

# Never cancel a release mid-flight — let it complete
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.25.8'
  PLATFORMS: linux/amd64,linux/arm64
  # Use pre-built tauri-cli from GitHub releases instead of compiling from source.
  # This saves 8-11 minutes per desktop runner.
  TAURI_CLI_VERSION: '2.10.1'

jobs:
  # ── Gate: version consistency + CI status ────────────────────────────────
  version-check:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify all version files match
        id: version
        run: |
          set -euo pipefail
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
          # Strip prerelease suffix (-rc.1, -beta.2, -alpha) for comparison.
          # Source files track the final release version; RC/beta tags are
          # build flavors of the same codebase, not different versions.
          BASE_VERSION=${TAG_VERSION%%-*}
          echo "Comparing source files against base version: $BASE_VERSION (from tag v$TAG_VERSION)"

          VERSIONS=(
            "$(jq -r '.version' kubilitics-frontend/package.json)"
            "$(jq -r '.version' kubilitics-desktop/src-tauri/tauri.conf.json)"
            "$(grep '^version' kubilitics-desktop/src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
            "$(grep '^version:' deploy/helm/kubilitics/Chart.yaml | awk '{print $2}')"
            "$(grep '^appVersion:' deploy/helm/kubilitics/Chart.yaml | sed 's/appVersion: *"\(.*\)"/\1/')"
            "$(grep '  tag:' deploy/helm/kubilitics/values.yaml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          )

          ERRORS=0
          for V in "${VERSIONS[@]}"; do
            if [ "$V" != "$BASE_VERSION" ]; then
              echo "MISMATCH: expected $BASE_VERSION, got $V"
              ERRORS=$((ERRORS + 1))
            fi
          done
          [ $ERRORS -eq 0 ] && echo "All 6 version files match v$BASE_VERSION (tag v$TAG_VERSION)" || exit 1

      - name: Verify CI passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          RELEASE_JOBS="Version Consistency Check|Backend Docker Image|Frontend Dist|Desktop|Create GitHub Release"

          RESPONSE=$(gh api repos/${{ github.repository }}/commits/${COMMIT_SHA}/check-runs \
            --jq "{
              total: [.check_runs[] | select(.name | test(\"$RELEASE_JOBS\") | not)] | length,
              failed: [.check_runs[] | select(.name | test(\"$RELEASE_JOBS\") | not) | select(.conclusion == \"failure\" or .conclusion == \"cancelled\")] | length,
              failed_names: [.check_runs[] | select(.name | test(\"$RELEASE_JOBS\") | not) | select(.conclusion == \"failure\" or .conclusion == \"cancelled\") | .name]
            }")

          FAILED=$(echo "$RESPONSE" | jq -r '.failed')
          TOTAL=$(echo "$RESPONSE" | jq -r '.total')

          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: $FAILED CI check(s) failed."
            echo "$RESPONSE" | jq -r '.failed_names[]'
            exit 1
          fi
          [ "$TOTAL" -eq 0 ] && echo "WARNING: No CI runs found. Proceeding." || echo "All $TOTAL CI checks passed."

      - name: Check macOS signing config
        run: bash scripts/check-tauri-signing-config.sh

  # ── Frontend dist: build once, share across 3 desktop runners ───────────
  # Scanning happens in CI (on PR) and weekly deep scans — not at release time.
  # Release pipeline is build + sign + ship. Fast and reliable.
  frontend-dist:
    name: Frontend Dist (Tauri)
    needs: [version-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kubilitics-frontend/package-lock.json
      - run: npm ci
        working-directory: kubilitics-frontend
      - run: npm run build
        working-directory: kubilitics-frontend
        env:
          TAURI_BUILD: "true"
      - name: Upload source maps to Sentry
        if: ${{ vars.SENTRY_ORG != '' }}
        run: npx @sentry/cli sourcemaps upload --release=kubilitics@${{ needs.version-check.outputs.version }} dist/
        working-directory: kubilitics-frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-tauri-${{ github.ref_name }}
          path: kubilitics-frontend/dist/
          retention-days: 1
          compression-level: 1

  # ── Docker: build + push backend image (runs parallel with desktop) ─────
  docker-backend:
    name: Backend Docker Image
    needs: [version-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./kubilitics-backend
          file: ./kubilitics-backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubilitics-backend:${{ needs.version-check.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/kubilitics-backend:latest
          build-args: |
            APP_VERSION=${{ needs.version-check.outputs.version }}
          platforms: ${{ env.PLATFORMS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ── Desktop: 3 platforms in parallel ────────────────────────────────────
  # Key optimizations:
  #   1. Pre-built tauri-cli binary (saves 8-11 min per runner)
  #   2. Frontend dist shared via artifact (saves 5 min per runner)
  #   3. Go sidecars built in parallel with `& wait`
  #   4. Swatinem/rust-cache for Rust build cache
  #   5. Go module cache via setup-go
  desktop:
    name: Desktop (${{ matrix.name }})
    timeout-minutes: 45
    needs: [frontend-dist]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Clean stale build artifacts
        shell: bash
        run: |
          rm -rf kubilitics-desktop/src-tauri/binaries
          mkdir -p kubilitics-desktop/src-tauri/binaries
          rm -rf kubilitics-desktop/src-tauri/target/release
          rm -rf kubilitics-desktop/src-tauri/target/universal-apple-darwin

      # ── Rust toolchain ──────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kubilitics-desktop/src-tauri -> target
          cache-on-failure: true

      # ── Tauri CLI: download pre-built binary directly ──────────────────
      # `cargo install tauri-cli` compiles from source (8-11 min).
      # Direct download from Tauri GitHub release: <10 seconds.
      - name: Install Tauri CLI (pre-built)
        shell: bash
        run: |
          TAG="tauri-cli-v${{ env.TAURI_CLI_VERSION }}"
          if [ "${{ matrix.os }}" == "macos-15" ]; then
            ASSET="cargo-tauri-aarch64-apple-darwin.zip"
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            ASSET="cargo-tauri-x86_64-pc-windows-msvc.zip"
          else
            ASSET="cargo-tauri-x86_64-unknown-linux-gnu.tgz"
          fi
          echo "Downloading $ASSET from $TAG..."
          URL="https://github.com/tauri-apps/tauri/releases/download/${TAG}/${ASSET}"
          curl -fsSL "$URL" -o /tmp/tauri-cli-archive
          if [[ "$ASSET" == *.zip ]]; then
            unzip -o /tmp/tauri-cli-archive -d /tmp/tauri-cli
            cp /tmp/tauri-cli/cargo-tauri* "$HOME/.cargo/bin/"
          else
            tar xzf /tmp/tauri-cli-archive -C "$HOME/.cargo/bin/"
          fi
          chmod +x "$HOME/.cargo/bin/cargo-tauri"*
          cargo tauri --version

      # ── Linux system deps ───────────────────────────────────────────────
      - name: Install GTK / WebKit deps (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # ── Frontend dist (pre-built) ──────────────────────────────────────
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist-tauri-${{ github.ref_name }}
          path: kubilitics-frontend/dist/
      - name: Copy frontend dist into Tauri working dir
        shell: bash
        run: |
          [ -n "$(ls -A kubilitics-frontend/dist 2>/dev/null)" ] || { echo "❌ dist empty"; exit 1; }
          mkdir -p kubilitics-desktop/dist
          cp -r kubilitics-frontend/dist/. kubilitics-desktop/dist/

      # ── Go toolchain ────────────────────────────────────────────────────
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: kubilitics-backend/go.sum

      # Brain source now lives in-monorepo at ./brain/ — no cross-repo
      # checkout is needed since the Phase A subtree migration from
      # github.com/vellankikoti/kotg.ai into this repository.

      # ── Windows version resources ───────────────────────────────────────
      - name: Embed Windows version resources
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          go install github.com/tc-hib/go-winres@latest
          bash scripts/embed-winres.sh "${{ github.ref_name }}"

      # ── Build Go sidecar binaries IN PARALLEL ──────────────────────────
      - name: Build Go sidecars (parallel)
        shell: bash
        run: |
          BINS="kubilitics-desktop/src-tauri/binaries"
          mkdir -p "$BINS"
          VERSION=${GITHUB_REF#refs/tags/v}
          BACKEND_LDFLAGS="-s -w -X github.com/kubilitics/kubilitics-backend/internal/version.Version=${VERSION}"

          # Brain lives in-monorepo at ./brain/ after Phase A.
          BRAIN_SRC="brain"
          BRAIN_PKG="./cmd/server"
          if [ "${{ matrix.os }}" == "macos-15" ]; then
            (cd kubilitics-backend && CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="$BACKEND_LDFLAGS" -o "../$BINS/kubilitics-backend-x86_64-apple-darwin"   ./cmd/server) &
            (cd kubilitics-backend && CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="$BACKEND_LDFLAGS" -o "../$BINS/kubilitics-backend-aarch64-apple-darwin"  ./cmd/server) &
            (cd kubilitics-cli    && CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o "../$BINS/kcli-x86_64-apple-darwin"                  ./cmd/kcli) &
            (cd kubilitics-cli    && CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o "../$BINS/kcli-aarch64-apple-darwin"                 ./cmd/kcli) &
            (cd "$BRAIN_SRC"      && CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o "../$BINS/kubilitics-ai-server-x86_64-apple-darwin"   $BRAIN_PKG) &
            (cd "$BRAIN_SRC"      && CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o "../$BINS/kubilitics-ai-server-aarch64-apple-darwin"  $BRAIN_PKG) &
            wait
            lipo -create "$BINS/kubilitics-backend-x86_64-apple-darwin" \
                         "$BINS/kubilitics-backend-aarch64-apple-darwin" \
                 -output "$BINS/kubilitics-backend-universal-apple-darwin"
            lipo -create "$BINS/kcli-x86_64-apple-darwin" \
                         "$BINS/kcli-aarch64-apple-darwin" \
                 -output "$BINS/kcli-universal-apple-darwin"
            lipo -create "$BINS/kubilitics-ai-server-x86_64-apple-darwin" \
                         "$BINS/kubilitics-ai-server-aarch64-apple-darwin" \
                 -output "$BINS/kubilitics-ai-server-universal-apple-darwin"
            chmod +x "$BINS/kubilitics-backend-"* "$BINS/kcli-"* "$BINS/kubilitics-ai-server-"*

          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            cd kubilitics-backend
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
              -ldflags="-X github.com/kubilitics/kubilitics-backend/internal/version.Version=${VERSION}" \
              -o "../$BINS/kubilitics-backend-x86_64-pc-windows-msvc.exe" ./cmd/server
            cd ../kubilitics-cli
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
              -o "../$BINS/kcli-x86_64-pc-windows-msvc.exe" ./cmd/kcli
            cd "../$BRAIN_SRC"
            # Brain is in the monorepo go.work workspace as of Phase B.
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
              -ldflags="-s -w" \
              -o "../$BINS/kubilitics-ai-server-x86_64-pc-windows-msvc.exe" $BRAIN_PKG

          else
            (cd kubilitics-backend && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="$BACKEND_LDFLAGS" -o "../$BINS/kubilitics-backend-x86_64-unknown-linux-gnu"   ./cmd/server) &
            (cd kubilitics-backend && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="$BACKEND_LDFLAGS" -o "../$BINS/kubilitics-backend-aarch64-unknown-linux-gnu"  ./cmd/server) &
            (cd kubilitics-cli    && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o "../$BINS/kcli-x86_64-unknown-linux-gnu"                  ./cmd/kcli) &
            (cd kubilitics-cli    && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o "../$BINS/kcli-aarch64-unknown-linux-gnu"                 ./cmd/kcli) &
            (cd "$BRAIN_SRC"      && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o "../$BINS/kubilitics-ai-server-x86_64-unknown-linux-gnu"   $BRAIN_PKG) &
            (cd "$BRAIN_SRC"      && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o "../$BINS/kubilitics-ai-server-aarch64-unknown-linux-gnu"  $BRAIN_PKG) &
            wait
            chmod +x "$BINS/kubilitics-backend-"* "$BINS/kcli-"* "$BINS/kubilitics-ai-server-"*
          fi

      - name: Verify all required binaries exist
        shell: bash
        run: |
          BINS="kubilitics-desktop/src-tauri/binaries"
          if [ "${{ matrix.os }}" == "macos-15" ]; then
            REQUIRED=("kubilitics-backend-universal-apple-darwin" "kcli-universal-apple-darwin" "kubilitics-ai-server-universal-apple-darwin")
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            REQUIRED=("kubilitics-backend-x86_64-pc-windows-msvc.exe" "kcli-x86_64-pc-windows-msvc.exe" "kubilitics-ai-server-x86_64-pc-windows-msvc.exe")
          else
            REQUIRED=("kubilitics-backend-x86_64-unknown-linux-gnu" "kcli-x86_64-unknown-linux-gnu" "kubilitics-ai-server-x86_64-unknown-linux-gnu")
          fi
          for bin in "${REQUIRED[@]}"; do
            [ -f "$BINS/$bin" ] && echo "✅ $bin" || { echo "❌ Missing: $bin"; exit 1; }
          done

      # ── macOS DMG tooling ───────────────────────────────────────────────
      # Tauri's bundle_dmg.sh requires create-dmg; not pre-installed on runners.
      - name: Install create-dmg (macOS only)
        if: matrix.os == 'macos-15'
        run: brew install create-dmg

      # ── macOS code signing ──────────────────────────────────────────────
      - name: Setup macOS code signing
        if: matrix.os == 'macos-15'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
            # Create a dedicated build keychain
            security create-keychain -p "build" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "build" build.keychain
            # Prevent keychain from auto-locking (root cause of codesign hang)
            security set-keychain-settings build.keychain
            # Import certificate and allow codesign access without prompt
            security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "build" build.keychain
            # Verify certificate was imported
            security find-identity -v build.keychain | head -5
            rm certificate.p12
          fi

      # ── Tauri builds ───────────────────────────────────────────────────
      # Build the .app only (no dmg). We create the DMG ourselves after
      # patching Info.plist and re-signing, so the shipped DMG always
      # contains the patched .app. APPLE_ID is intentionally omitted here
      # to prevent Tauri's inline notarize→bundle_dmg.sh chain, which
      # breaks on macOS 15+ runners.
      - name: Build Tauri app (macOS universal)
        if: matrix.os == 'macos-15'
        working-directory: kubilitics-desktop/src-tauri
        env:
          TAURI_SKIP_DEVSERVER_CHECK: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          [ -d "../dist" ] && [ -n "$(ls -A ../dist)" ] || { echo "❌ dist missing"; exit 1; }
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            CONFIG='{"bundle":{"macOS":{"signingIdentity":"${{ secrets.APPLE_SIGNING_IDENTITY }}"}}}'
          else
            CONFIG='{"bundle":{"macOS":{"signingIdentity":null}}}'
          fi
          CI=true cargo tauri build --target universal-apple-darwin --bundles app --config "$CONFIG"

      # Post-build steps for macOS:
      # 1. Verify LSRequiresCarbon is absent (set to false in tauri.conf.json,
      #    but double-check and strip it if Tauri's template still adds it).
      # 2. Re-sign with Developer ID after any plist changes.
      # 3. Create the DMG ourselves from the patched+signed .app — this ensures
      #    the shipped DMG contains the correct app, not the pre-patch version.
      # 4. Notarize the DMG, staple, and gate-check via Gatekeeper.
      - name: Verify and strip LSRequiresCarbon from Info.plist
        if: matrix.os == 'macos-15'
        run: |
          APP=$(find kubilitics-desktop/src-tauri/target/universal-apple-darwin/release/bundle -name "Kubilitics.app" -type d | head -1)
          PLIST="$APP/Contents/Info.plist"
          python3 - <<'PYEOF'
import plistlib, sys, os
plist_path = os.environ.get("PLIST_PATH")
with open(plist_path, "rb") as f:
    pl = plistlib.load(f)
had_carbon = pl.pop("LSRequiresCarbon", None)
pl["NSPrincipalClass"] = "NSApplication"
pl["LSMinimumSystemVersion"] = "12.0"
with open(plist_path, "wb") as f:
    plistlib.dump(pl, f)
if had_carbon:
    print(f"Removed LSRequiresCarbon (was {had_carbon})")
else:
    print("LSRequiresCarbon was not present — nothing to strip")
print("Keys now:", sorted(pl.keys()))
PYEOF
        env:
          PLIST_PATH: ${{ github.workspace }}/kubilitics-desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Kubilitics.app/Contents/Info.plist

      - name: Re-sign app after Info.plist verification
        if: matrix.os == 'macos-15'
        run: |
          APP=$(find kubilitics-desktop/src-tauri/target/universal-apple-darwin/release/bundle -name "Kubilitics.app" -type d | head -1)
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}"
          else
            IDENTITY="-"
          fi
          # Sign from inside out: sign each embedded binary first, then the bundle.
          for bin in "$APP/Contents/MacOS/"*; do
            codesign --force --sign "$IDENTITY" --options runtime \
              --entitlements kubilitics-desktop/src-tauri/entitlements.plist "$bin"
          done
          codesign --force --sign "$IDENTITY" --options runtime \
            --entitlements kubilitics-desktop/src-tauri/entitlements.plist "$APP"
          codesign --verify --deep --strict "$APP"
          echo "Re-signed and verified: $APP"

      - name: Verify macOS codesign
        if: matrix.os == 'macos-15'
        run: |
          APP=$(find kubilitics-desktop/src-tauri/target/universal-apple-darwin/release/bundle -name "Kubilitics.app" -type d | head -1)
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            if ! codesign -dv --verbose=4 "$APP" 2>&1 | grep -qE 'Authority=Developer ID Application'; then
              echo "::error::App is NOT signed with Developer ID Application."
              codesign -dv --verbose=4 "$APP" 2>&1 || true
              exit 1
            fi
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "codesign verification passed."

      - name: Create DMG from patched app
        if: matrix.os == 'macos-15'
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          APP=$(find kubilitics-desktop/src-tauri/target/universal-apple-darwin/release/bundle -name "Kubilitics.app" -type d | head -1)
          DMG_DIR="kubilitics-desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          DMG="$DMG_DIR/Kubilitics_${VERSION}_universal.dmg"
          echo "Creating DMG at $DMG from $APP"
          create-dmg \
            --volname "Kubilitics" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "$DMG" \
            "$APP"
          echo "DMG created: $(ls -lh "$DMG")"

      - name: Notarize macOS DMG
        if: matrix.os == 'macos-15'
        timeout-minutes: 25
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(find kubilitics-desktop/src-tauri/target/universal-apple-darwin/release/bundle -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No .dmg found to notarize."
            exit 1
          fi
          if [ -z "$APPLE_ID" ]; then
            echo "::error::APPLE_ID secret is empty — refusing to ship un-notarized DMG."
            exit 1
          fi
          echo "Notarizing $DMG..."
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 20m
          xcrun stapler staple "$DMG"
          echo "Notarization and stapling complete"
          xcrun stapler validate "$DMG" || {
            echo "::error::stapler validate failed."
            exit 1
          }
          if ! spctl -a -vv -t install "$DMG" 2>&1 | grep -q 'accepted'; then
            echo "::error::Gatekeeper rejected the DMG."
            spctl -a -vv -t install "$DMG" 2>&1 || true
            exit 1
          fi
          echo "Gatekeeper: DMG accepted."

      - name: Build Tauri app (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: kubilitics-desktop/src-tauri
        shell: bash
        env:
          TAURI_SKIP_DEVSERVER_CHECK: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -d "../dist" ] && [ -n "$(ls -A ../dist)" ] || { echo "❌ dist missing"; exit 1; }
          # MSI requires numeric-only prerelease identifiers (each <=65535). For tags
          # like v1.0.0-rc.1 the bundler aborts. NSIS accepts any version, so skip MSI
          # for prereleases — they're for testing the updater path, not for distribution
          # via MSI managed-install channels.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis
          else
            cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi
          fi

      - name: Build Tauri app (Linux AppImage + DEB + RPM)
        if: matrix.os == 'ubuntu-latest'
        working-directory: kubilitics-desktop/src-tauri
        env:
          TAURI_SKIP_DEVSERVER_CHECK: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -d "../dist" ] && [ -n "$(ls -A ../dist)" ] || { echo "❌ dist missing"; exit 1; }
          cargo tauri build --target x86_64-unknown-linux-gnu --bundles appimage,deb,rpm

      # ── Upload artifacts ────────────────────────────────────────────────
      # Upload ONLY installer files and their signatures, not the full
      # bundle/ tree. Previously, uploading bundle/ captured the uncompressed
      # AppDir / .app tree (~200MB) alongside the real installers, so a
      # workflow artifact for Linux was 496MB even though the .AppImage is
      # only 118MB. The "Create GitHub Release" job later globs the same
      # extensions anyway, so nothing downstream depends on the full tree.
      - name: Upload desktop artifacts (macOS)
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@v7
        with:
          name: kubilitics-desktop-${{ matrix.name }}-${{ github.ref_name }}
          path: |
            kubilitics-desktop/src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            kubilitics-desktop/src-tauri/target/universal-apple-darwin/release/bundle/**/*.app.tar.gz
            kubilitics-desktop/src-tauri/target/universal-apple-darwin/release/bundle/**/*.sig
          compression-level: 1

      - name: Upload desktop artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: kubilitics-desktop-${{ matrix.name }}-${{ github.ref_name }}
          path: |
            kubilitics-desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.AppImage
            kubilitics-desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.AppImage.tar.gz
            kubilitics-desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.deb
            kubilitics-desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.rpm
            kubilitics-desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.sig
          compression-level: 1

      - name: Upload desktop artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: kubilitics-desktop-${{ matrix.name }}-${{ github.ref_name }}
          path: |
            kubilitics-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
            kubilitics-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*-setup.exe
            kubilitics-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.nsis.zip
            kubilitics-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.sig
          compression-level: 1

  # ── Create GitHub Release ──────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [desktop, docker-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts for release upload
        run: |
          mkdir -p release-assets
          find artifacts -type f \( \
            -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \
            -o -name "*.rpm" -o -name "*-setup.exe" -o -name "*.msi" \
            -o -name "*.nsis.zip" -o -name "*.tar.gz" -o -name "*.sig" \
          \) -exec cp {} release-assets/ \;
          echo "Release assets:"
          ls -lh release-assets/
          echo "Total: $(ls release-assets/ | wc -l) files"

      - name: Generate auto-update manifest (latest.json)
        run: |
          VERSION="${{ github.ref_name }}"
          MACOS_SIG=$(cat release-assets/*.app.tar.gz.sig 2>/dev/null || echo "")
          LINUX_SIG=$(cat release-assets/*.AppImage.tar.gz.sig 2>/dev/null || echo "")
          WINDOWS_SIG=$(cat release-assets/*.nsis.zip.sig 2>/dev/null || echo "")

          cat > release-assets/latest.json << MANIFEST
          {
            "version": "${VERSION#v}",
            "notes": "Kubilitics ${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MACOS_SIG}",
                "url": "https://github.com/vellankikoti/kubilitics/releases/download/${VERSION}/Kubilitics.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "${MACOS_SIG}",
                "url": "https://github.com/vellankikoti/kubilitics/releases/download/${VERSION}/Kubilitics.app.tar.gz"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "https://github.com/vellankikoti/kubilitics/releases/download/${VERSION}/Kubilitics.AppImage.tar.gz"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_SIG}",
                "url": "https://github.com/vellankikoti/kubilitics/releases/download/${VERSION}/Kubilitics_${VERSION#v}_x64-setup.nsis.zip"
              }
            }
          }
          MANIFEST
          echo "Generated latest.json:"
          cat release-assets/latest.json

      - name: Generate checksums
        working-directory: release-assets
        run: |
          [ -n "$(ls -A .)" ] || { echo "No assets — skipping"; exit 0; }
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-') }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
