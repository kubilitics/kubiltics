name: Helm Chart CI

# PR-time lint + test for all Helm charts in this repo. Publish lives in
# charts-publish.yml (tag-triggered, signed OCI push to ghcr.io).

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'deploy/helm/kubilitics/**'
      - 'charts/kubilitics-otel/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: '3.16.0'

      - name: Add Helm repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Lint chart
        working-directory: deploy/helm/kubilitics
        run: |
          helm dependency update .
          helm dependency build .
          helm lint .

      - name: Validate chart values
        working-directory: deploy/helm/kubilitics
        run: |
          # Test with default values
          helm template . --debug --dry-run > /dev/null
          
          # Test with PostgreSQL enabled
          helm template . --debug --dry-run \
            --set database.type=postgresql \
            --set postgresql.enabled=true > /dev/null
          
          # Test with frontend enabled
          helm template . --debug --dry-run \
            --set frontend.enabled=true > /dev/null
          
          # Test with AI enabled
          helm template . --debug --dry-run \
            --set ai.enabled=true > /dev/null
          
          # Test with all components enabled
          helm template . --debug --dry-run \
            --set database.type=postgresql \
            --set postgresql.enabled=true \
            --set frontend.enabled=true \
            --set ai.enabled=true \
            --set ingress.enabled=true > /dev/null
          
          echo "✓ All value combinations validated successfully"

  test:
    name: Test Chart
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: '3.16.0'

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_kind: true
          install_kubectl: true

      - name: Create kind cluster
        run: |
          kind create cluster --wait 5m --config=- <<EOF
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
          EOF

      - name: Add Helm repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Install chart (dry-run template validation)
        working-directory: deploy/helm/kubilitics
        run: |
          helm dependency update .
          # Dry-run validates all templates render correctly with real values.
          # We skip --wait because the backend image may not be pullable in
          # a CI kind cluster (no GHCR credentials / image may not exist yet).
          helm install kubilitics-test . \
            --namespace kubilitics-test \
            --create-namespace \
            --set replicaCount=1 \
            --set persistence.enabled=false \
            --set rbac.enabled=false \
            --set serviceAccount.create=false \
            --dry-run

      - name: Install chart into kind cluster (smoke test)
        continue-on-error: true
        working-directory: deploy/helm/kubilitics
        run: |
          helm install kubilitics-test . \
            --namespace kubilitics-test \
            --create-namespace \
            --set replicaCount=1 \
            --set persistence.enabled=false \
            --set rbac.enabled=false \
            --set serviceAccount.create=false \
            --timeout 5m
          # Wait briefly for resources to be created
          sleep 10
          kubectl get all -n kubilitics-test || true

      - name: Run Helm tests
        continue-on-error: true
        working-directory: deploy/helm/kubilitics
        run: |
          helm test kubilitics-test --namespace kubilitics-test --timeout 3m || echo "Tests skipped (image not pullable in CI kind cluster)"

      - name: Cleanup
        if: always()
        working-directory: deploy/helm/kubilitics
        run: |
          helm uninstall kubilitics-test --namespace kubilitics-test || true
          kubectl delete namespace kubilitics-test --wait=false || true

  lint-otel:
    name: Lint OTel Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: '3.16.0'

      - name: Lint OTel chart
        working-directory: charts/kubilitics-otel
        run: |
          helm lint . \
            --set kubilitics.clusterId=lint \
            --set kubilitics.backendUrl=http://lint.example.com
          helm template . \
            --set kubilitics.clusterId=lint \
            --set kubilitics.backendUrl=http://lint.example.com \
            --debug --dry-run > /dev/null

      - name: Verify OTel chart embed sync
        run: |
          bash kubilitics-backend/internal/otel/sync_chart.sh
          if ! git diff --quiet kubilitics-backend/internal/otel/chart/; then
            echo "::error::Embedded OTel chart is out of sync with charts/kubilitics-otel/."
            echo "Run 'cd kubilitics-backend && go generate ./internal/otel/...' and commit."
            git diff --stat kubilitics-backend/internal/otel/chart/
            exit 1
          fi
