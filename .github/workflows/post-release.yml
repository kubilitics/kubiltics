# Post-release automation: update package manager manifests after a successful release
name: Post-Release Distribution

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  # ── Update winget manifest for desktop app ──────────────────────────────
  update-winget:
    name: Submit winget Manifest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - name: Skip if no token
        if: env.HAS_WINGET_TOKEN != 'true'
        run: echo "WINGET_TOKEN not set — skipping winget submission"

      - name: Wait for release assets to propagate
        if: env.HAS_WINGET_TOKEN == 'true'
        run: sleep 60

      - uses: vedantmgoyal9/winget-releaser@v2
        if: env.HAS_WINGET_TOKEN == 'true'
        id: winget-attempt
        continue-on-error: true
        with:
          identifier: Kubilitics.Kubilitics
          installers-regex: 'Kubilitics[_-].*x64[-_]setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Retry winget submission
        if: env.HAS_WINGET_TOKEN == 'true' && steps.winget-attempt.outcome == 'failure'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Kubilitics.Kubilitics
          installers-regex: 'Kubilitics[_-].*x64[-_]setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  # ── Notify Homebrew tap of new release ──────────────────────────────────
  #
  # Pull-model design: the tap at vellankikoti/homebrew-kubilitics runs its
  # own scheduled workflow (.github/workflows/sync-upstream.yml over there)
  # that polls this repo's /releases/latest every 30 min and self-updates
  # using its own default GITHUB_TOKEN. Zero cross-repo secrets are
  # required for correctness.
  #
  # This job is a best-effort low-latency nudge: if HOMEBREW_TAP_DISPATCH
  # is present (a fine-grained PAT scoped to contents:write on the tap
  # only), fire a repository_dispatch so the tap picks up the release
  # immediately instead of waiting up to 30 min. The step is
  # continue-on-error — the poll is the invariant, this is convenience.
  notify-homebrew-tap:
    name: Notify Homebrew Tap
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    env:
      HAS_DISPATCH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH != '' }}
    steps:
      - name: Skip if no dispatch token (poll will pick it up within 30 min)
        if: env.HAS_DISPATCH_TOKEN != 'true'
        run: echo "HOMEBREW_TAP_DISPATCH not set — tap will self-update via schedule."

      - name: Fire repository_dispatch
        if: env.HAS_DISPATCH_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          gh api "repos/vellankikoti/homebrew-kubilitics/dispatches" \
            -f event_type='kubilitics-release' \
            -f "client_payload[tag]=${TAG}"
