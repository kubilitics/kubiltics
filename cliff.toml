# git-cliff configuration for auto-generated CHANGELOG.md.
#
# Invoked by .github/workflows/changelog.yml after each release tag is
# pushed.  Groups conventional-commit types into reader-friendly sections
# and links each entry back to its GitHub commit.

[changelog]
header = """
# Changelog

All notable changes to Kubilitics will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## [UNRELEASED]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}- {{ commit.message | upper_first | trim }}\
{% if commit.github.username %} by @{{ commit.github.username }}{% endif %} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/vellankikoti/kubilitics/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps", skip = true },
  { message = "^chore", group = "Misc" },
  { message = "^security", group = "Security" },
  { body = "BREAKING CHANGE", group = "Breaking" },
]
filter_commits = true
tag_pattern = "v[0-9].*"
