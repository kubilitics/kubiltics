version: "2"

run:
  timeout: 5m
  tests: false

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*compress/gzip.Writer).Flush
        - (*compress/gzip.Writer).Close
        - (*encoding/json.Encoder).Encode

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
