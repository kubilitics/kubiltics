version: "3.9"

# KOTG.AI — Local development environment
# Usage: docker compose up -d

services:
  # ── Ollama: local LLM inference engine ─────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: kotg-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=2
    # GPU support (uncomment if NVIDIA GPU available):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Qdrant: vector database for RAG ────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: kotg-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Model downloader (runs once to pull default models) ────────────────────
  model-setup:
    image: ollama/ollama:latest
    container_name: kotg-model-setup
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling KOTG.AI models..."
        ollama pull nomic-embed-text || echo "WARN: nomic-embed-text failed"
        ollama pull qwen2.5:0.5b     || echo "WARN: qwen2.5:0.5b failed"
        ollama pull qwen2.5:3b       || echo "WARN: qwen2.5:3b failed"
        echo "Model setup complete. For medium/large models run: kotg models install medium"
    restart: "no"

volumes:
  ollama_data:
    name: kotg_ollama_data
  qdrant_data:
    name: kotg_qdrant_data

networks:
  default:
    name: kotg_network
