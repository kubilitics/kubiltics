apiVersion: v1
kind: Pod
metadata:
  name: json-logger
  labels:
    app: json-logger
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: logger
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        - |
          while true; do
            echo "{\"level\":\"info\",\"ts\":\"$(date +%Y-%m-%dT%H:%M:%S)\",\"msg\":\"health check passed\",\"status\":200,\"latency_ms\":$((RANDOM % 100))}"
            sleep 3
          done
