{{- /*
Render a Secret only when the user provided an inline llm.<provider>.apiKey
AND did NOT reference an existing secret. Existing-secret path leaves Secret
management to the user (cert-manager, sealed-secrets, vault, etc.).
*/ -}}
{{- $p := .Values.llm.provider -}}
{{- $inline := "" -}}
{{- $usingExternal := false -}}
{{- if eq $p "openai" -}}
  {{- $inline = .Values.llm.openai.apiKey -}}
  {{- $usingExternal = ne (.Values.llm.openai.apiKeySecretRef.name | default "") "" -}}
{{- else if eq $p "anthropic" -}}
  {{- $inline = .Values.llm.anthropic.apiKey -}}
  {{- $usingExternal = ne (.Values.llm.anthropic.apiKeySecretRef.name | default "") "" -}}
{{- else if eq $p "custom" -}}
  {{- $inline = .Values.llm.custom.apiKey -}}
  {{- $usingExternal = ne (.Values.llm.custom.apiKeySecretRef.name | default "") "" -}}
{{- end -}}
{{- if and (not $usingExternal) $inline -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubilitics-ai.fullname" . }}-llm
  labels:
    {{- include "kubilitics-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ $inline | quote }}
{{- end }}
